<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> MY TIME TABLE</title>
</head>
<body>
        <a href = "https://www.kluniversity.in/"><img src="./kllogo.png" alt="KL University" width="200" height="200"></a>

          <h1 style="text-align:center">Koneru Lakshmaiah Educational Foundation</h1>
        <br>
    
    <table border="5" style="width:90%">
        <caption>saiyasaswini_timetable</caption>
        <colgroup>
            <col style="background-color: rgb(244, 211, 244)">
            <col style="background-color :rgb(244, 211, 244)">
            <col style="background-color: rgb(244, 211, 244)">
            <col style="background-color: rgb(242, 121, 242)">
            <col style="background-color: rgb(244, 211, 244)">
            <col style="background-color :rgb(244, 211, 244)" >
            <col style="background-color: rgb(242, 121, 242)"> 
            <col style="background-color: rgb(244, 211, 244)">
            <col style="background-color: rgb(244, 211, 244)">                
        </colgroup>
    
           
        <thead>
            <tr style="background-color: rgb(242, 121, 242)">
                <th>Day</th>
                <th>1 </th>
                <th>2 </th>
                <th>Break</th>
                <th>3 </th>
                <th>4 </th>
                <th>Break</th>
                <th>5 </th>
                <th>6 </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td colspan="2" rowspan="2" style="padding:20px">math</td>
                
                <td rowspan="6" ><br></td>
                <td colspan="2" rowspan="2" style="padding:20px">dsa</td>
                <td rowspan="6"><br></td>
                <td colspan="2" style="padding:20px">iot</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                
                <td colspan="2" style="padding:20px">fullstack</td>
                
            </tr>
            <tr>
               <td>Wednesday</td>

               <td colspan="2" style="padding:20px">math</td>

                 <td colspan="2"  rowspan="2" style="padding:20px">iot</td>
                
                 <td colspan="2" rowspan="2" style="padding:20px">fullstack</td>
                
            </tr>
            <tr>
                <td>Thursday</td>

                    <td colspan="2" rowspan="2" style="padding:20px">dsa</td>

            </tr>
            <tr>
                <td>Friday</td>

                <td colspan="2" rowspan="2" style="padding:20px">fullstack</td>
                
                <td colspan="2" style="padding:20px">english</td>
                
            </tr>
            <tr>
                    <td>Saturday</td>

                    <td colspan="2" style="padding:20px">iot</td>
                    <td> english</td>
                    <td>dsa</td>
                </tr>
        </tbody>
    
</body>
</html>
