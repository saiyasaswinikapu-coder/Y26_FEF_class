<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLES</title>
</head>
<body>
    <h2>HTML TABLE TAG EXAMPLE</h2>
    <table border="1">
            <caption>Student Marks</caption>
            <colgroup>
                <col style="background-color: lightblue">
                <col style="background-color: lightpink">
                <col style="background-color: lightgoldenrodyellow">  
            </colgroup>

            <thead>
            <tr>
                <th>Student Name</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td rowspan="2" style="padding: 20px;">Sai</td>
                <td>HTML</td>
                <td>90</td>
            </tr>
            
            <tr>
               
                <td>CSS</td>
                <td>80</td>
             </tr>
             <tr>
                <td rowspan="2" style="padding: 20px;">hansi</td>
                <td>MATHS</td>
                <td>93</td>
            </tr>
            <tr>
                
                <td>CSS</td>
                <td>94</td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <th colspan="2"> Total students</th>
                
                <td>2</td>
            </tr>
            </tfoot>   
    </table>
</body>
</html>
